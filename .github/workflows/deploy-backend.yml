name: Deploy Backend to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - 'agents/**'
      - 'api/**'
      - 'core/**'
      - 'graph/**'
      - 'memory/**'
      - 'tools/**'
      - 'data/**'
      - 'requirements.txt'
      - 'Dockerfile'
      - '.github/workflows/deploy-backend.yml'

env:
  GCP_REGION: us-central1
  IMAGE_NAME: finsight-api

jobs:
  deploy:
    name: Build and Deploy to Cloud Run
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build and push Docker image
        run: |
          IMAGE_URI="us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/finsight-docker/${{ env.IMAGE_NAME }}"
          docker build -t "$IMAGE_URI:${{ github.sha }}" -t "$IMAGE_URI:latest" .
          docker push "$IMAGE_URI:${{ github.sha }}"
          docker push "$IMAGE_URI:latest"
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ secrets.CLOUD_RUN_SERVICE }} \
            --image="$IMAGE_URI:${{ github.sha }}" \
            --region=${{ env.GCP_REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --min-instances=1 \
            --max-instances=3 \
            --memory=2Gi \
            --cpu=1 \
            --timeout=300 \
            --port=8080 \
            --set-secrets=GROQ_API_KEY_1=GROQ_API_KEY_1:latest \
            --set-secrets=GROQ_API_KEY_2=GROQ_API_KEY_2:latest \
            --set-secrets=GROQ_API_KEY_3=GROQ_API_KEY_3:latest \
            --set-secrets=OPENROUTER_API_KEY_1=OPENROUTER_API_KEY_1:latest \
            --set-secrets=OPENROUTER_API_KEY_2=OPENROUTER_API_KEY_2:latest \
            --set-secrets=OPENROUTER_API_KEY_3=OPENROUTER_API_KEY_3:latest \
            --set-secrets=NVIDIA_API_KEY_1=NVIDIA_API_KEY_1:latest \
            --set-secrets=NVIDIA_API_KEY_2=NVIDIA_API_KEY_2:latest \
            --set-secrets=GEMINI_API_KEY=GEMINI_API_KEY:latest \
            --set-secrets=FRED_API_KEY=FRED_API_KEY:latest \
            --set-secrets=LANGSMITH_API_KEY=LANGSMITH_API_KEY:latest \
            --set-secrets=SECRET_KEY=SECRET_KEY:latest \
            --set-env-vars="ALLOWED_ORIGINS=*,LANGSMITH_PROJECT=finsight-ai" \
            --quiet

      - name: Get Cloud Run URL
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ secrets.CLOUD_RUN_SERVICE }} \
            --region=${{ env.GCP_REGION }} \
            --format='value(status.url)')
          echo "Backend live at: $SERVICE_URL"
# triggered
